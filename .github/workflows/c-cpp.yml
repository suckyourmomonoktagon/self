name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate no root autotools entrypoints exist
        run: |
          if [ -f ./configure ] || [ -f ./configure.ac ] || [ -f ./Makefile ] || [ -f ./Makefile.am ]; then
            echo "::error::Root autotools files were detected. Update .github/workflows/c-cpp.yml to run the actual root C/C++ build."
            exit 1
          fi
          echo "No root autotools entrypoints found; skipping root C/C++ build."
