name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          cpp:
            - "**/*.c"
            - "**/*.cc"
            - "**/*.cpp"
            - "**/*.cxx"
            - "**/*.h"
            - "**/*.hh"
            - "**/*.hpp"
            - "**/*.hxx"
            - "**/Makefile"
            - "**/Makefile.am"
            - "**/configure"
            - "**/configure.ac"
    - name: skip when no c/c++ changes
      if: steps.changes.outputs.cpp != 'true'
      run: echo "No C/C++ or autotools file changes detected; skipping build."
    - name: validate autotools layout
      if: steps.changes.outputs.cpp == 'true'
      run: |
        if [ ! -f ./configure ]; then
          echo "::error::C/C++ changes were detected, but ./configure is missing at repository root."
          exit 1
        fi
    - name: configure
      if: steps.changes.outputs.cpp == 'true'
      run: ./configure
    - name: make
      if: steps.changes.outputs.cpp == 'true'
      run: make
    - name: make check
      if: steps.changes.outputs.cpp == 'true'
      run: make check
    - name: make distcheck
      if: steps.changes.outputs.cpp == 'true'
      run: make distcheck
