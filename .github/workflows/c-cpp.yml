name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dedicated native/mobile CI workflows exist
        run: |
          test -f .github/workflows/native-shells-ci.yml
          test -f .github/workflows/mobile-sdk-ci.yml
          echo "Root autotools build is not used in this repository."
