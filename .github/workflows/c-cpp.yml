name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run Autotools build when available
        run: |
          if [[ -x ./configure ]]; then
            ./configure
            make
            make check
            make distcheck
          else
            echo "No ./configure script found; skipping C/C++ Autotools build."
          fi
