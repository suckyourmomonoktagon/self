name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: detect autotools project
      id: detect
      run: |
        if [ -f ./configure ]; then
          echo "has_configure=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_configure=false" >> "$GITHUB_OUTPUT"
          echo "No ./configure script found at repository root; skipping autotools build steps."
        fi
    - name: configure
      if: steps.detect.outputs.has_configure == 'true'
      run: ./configure
    - name: make
      if: steps.detect.outputs.has_configure == 'true'
      run: make
    - name: make check
      if: steps.detect.outputs.has_configure == 'true'
      run: make check
    - name: make distcheck
      if: steps.detect.outputs.has_configure == 'true'
      run: make distcheck
